# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

# https://hatch.pypa.io/latest/config/metadata/
[tool.hatch.version]
source = "vcs"

# read more about configuring hatch at:
# https://hatch.pypa.io/latest/config/build/
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

# https://peps.python.org/pep-0621/
[project]
name = "spleleton"
dynamic = ["version"]
description = "spleleton"
readme = "README.md"
requires-python = ">=3.12"
# https://peps.python.org/pep-0639/
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Yamauchi", email = "kevin.yamauchi@gmail.com" }]
# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
# add your package dependencies here
dependencies = [
    "networkx>=3.7",
    "numpy>=2.5.4",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
]

# https://peps.python.org/pep-0621/#dependencies-optional-dependencies
# add dependencies for "extra" features here.  Not dev dependencies.
[project.optional-dependencies]
torch = [
    "torch>=2.14.1",
]
jax = [
    "jax>=0.12.0",
    "optax>=0.2.8",
]
viz = [
    "napari[all]>=0.6.6",
]
# the benchmark's tables and plots (plans/benchmark_plan_v2.md)
bench = [
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pyarrow>=18",
]

[project.urls]
homepage = "https://github.com/kevinyamauchi/spleleton"
repository = "https://github.com/kevinyamauchi/spleleton"

# Entry points
# https://peps.python.org/pep-0621/#entry-points
# same as console_scripts entry point
# [project.scripts]
# spleleton-cli = "spleleton:main_cli"

# [project.entry-points."some.group"]
# tomatoes = "spleleton:main_tomatoes"

# https://peps.python.org/pep-0735/
# setup with `uv sync` or `pip install -e . --group dev`
[dependency-groups]
test = ["pytest>=9.0", "pytest-cov"]
dev = [
    { include-group = "test" },
    "jax>=0.12.0",
    "matplotlib>=3.10",
    "napari[all]>=0.6.6",
    "optax>=0.2.8",
    "pandas>=2.2",
    "prek",
    "pyarrow>=18",  # https://prek.j178.dev/
    "ruff",
    "torch>=2.14.1",
]

# https://docs.astral.sh/ruff
[tool.ruff]
line-length = 88
src = ["src"]
# fix = true  # auto-fix on `ruff check` (the pre-commit hook already passes --fix)
# unsafe-fixes = true

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
# ruff's default rule set is already extensive (F, E7/E9, B, UP, C4, SIM, PERF,
# PTH, FURB, RUF, ...). See https://docs.astral.sh/ruff/default-rules/
# the following are added on top of the defaults.
extend-select = [
    "E",    # style errors
    "W",    # style warnings
    "D",    # pydocstyle
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "RUF",  # ruff-specific rules
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
]
ignore = [
    "D401", # First line should be in imperative mood (remove to opt in)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]
"docs/*.py" = ["D", "A"]

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false  # default is false

# https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml
[tool.pytest]
minversion = "9.0"
addopts = ["--color=yes", "-p", "no:napari"]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = ["slow: long probe and Hessian tests, deselected in CI (-m 'not slow')"]

# https://coverage.readthedocs.io/
[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "raise AssertionError",
    "\\.\\.\\.",
    "raise NotImplementedError()",
    "pass",
]

[tool.coverage.run]
source = ["spleleton"]

# https://github.com/crate-ci/typos/blob/master/docs/reference.md
[tool.typos.default]
extend-ignore-identifiers-re = ["PNGs"]
